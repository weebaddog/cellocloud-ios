# XcodeGen spec (CI runs `xcodegen generate`; the .xcodeproj is not committed).
name: CelloCloud
options:
  bundleIdPrefix: com.cellocloud
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Overridden for the sideload build (a free Apple ID must not claim the real bundle id).
    CELLOCLOUD_BUNDLE_ID: com.cellocloud.app
packages:
  CelloCloudCore:
    path: Core
targets:
  CelloCloud:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: CelloCloudCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: CelloCloud
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: Camera backup reads new photos and videos to encrypt and back them up to your CelloCloud.
        NSPhotoLibraryAddUsageDescription: Save photos and videos from your CelloCloud to your library.
        # Cindy (Settings > Cindy): talking to her, scanning the PC's pairing code, reaching the PC at home
        NSMicrophoneUsageDescription: Talk to Cindy, your assistant on your PC, when you tap her mic.
        NSCameraUsageDescription: Scan the pairing code Cindy shows on your PC.
        NSLocalNetworkUsageDescription: Reach Cindy on your PC over your home Wi-Fi.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.cellocloud.backup]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CELLOCLOUD_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
schemes:
  CelloCloud:
    build:
      targets:
        CelloCloud: all
